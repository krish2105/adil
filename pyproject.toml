[project]
name = "adil"
version = "0.1.0"
description = "Explainable credit decisioning under UAE supervisory expectations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Krishna Mathur" }]
dependencies = [
    "spine",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    # Aggregation over the seven Home Credit tables (5.3 GB) runs out-of-core in
    # DuckDB; only the app-level result is ever loaded into pandas.
    "duckdb>=1.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optbinning>=0.19",
    "shap>=0.46",
    "fairlearn>=0.10",
    "pyyaml>=6",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "jupyter>=1.1",
    "nbconvert>=7",
]

[tool.uv.sources]
spine = { path = "../01-spine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adil"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
# D203/D213: conflict with the numpy convention selected below.
# D401: a metric's summary line should name the quantity it returns, not
#       command the reader. Kept consistent with SPINE.
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103"]
"scripts/*" = ["D103"]
# build_dashboard.py is largely an HTML and CSS template. Line length there is a
# property of the prose and the stylesheet, not of the Python, and hard-wrapping
# either to satisfy a code rule makes both harder to read.
"scripts/build_dashboard.py" = ["D103", "E501"]
# A helper defined in a notebook cell to keep that cell readable is not public API;
# the cell's own markdown says what it does. Everything in src/ still needs a docstring.
"notebooks/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
# src/adil is a testpath so that the worked example in every docstring runs as a
# doctest. An example that drifts from its code fails the suite.
testpaths = ["tests", "src/adil"]
addopts = "-q --cov=adil --cov-report=term-missing --doctest-modules"

[tool.coverage.run]
source = ["adil"]
