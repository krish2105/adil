fairness:
  attribute: Sex (CODE_GENDER), audited alongside age band (DAYS_BIRTH)
  attribute_status: protected
  note: These are genuine protected attributes, not proxies. The project brief assumed otherwise
    and the brief was wrong. Neither attribute is a model input — deciding on them would be
    disparate treatment — and both are retained for measurement only.
  unaddressable: Nationality and ethnicity are absent from Home Credit and no honest proxy
    exists. In a UAE context that is the axis that matters most. It is declared unaddressable
    rather than approximated, and nothing in this project speaks to it.
  prioritised_metric: Calibration by group. A group whose predicted probabilities exceed its
    observed default rate is charged for risk it does not carry, and no downstream threshold
    repairs that. The equalised-odds gap is reported in full rather than optimised away.
  approval_disparity_sex: 0.9555
  approval_disparity_age: 0.8207
  disparity_floor_imposed: 0.8
  single_cutoff: One cutoff for every applicant. Equalising error rates by group was shown
    to require a different cutoff per sex, which is disparate treatment, and it closed the
    true-positive gap without delivering equalised odds.
  proxy_audit: Excluding the attributes prevents disparate treatment, not disparate impact.
    From the 20 features the model actually uses, sex is recoverable at AUC 0.851 and age
    band at 0.875. Removing the columns did not remove the information.
limitations:
- Public competition data from another market, not UAE consumer data.
- No time axis exists in the source, so no out-of-time validation is possible and none is
  claimed. Metric stability over time is untested and would be a monitoring requirement before
  any deployment.
- 'Reason-code stability fails its pre-registered gate for every model tested, the scorecard
  included: 75.0% of declined applicants see their top-3 reasons change under a 0.5σ perturbation,
  against a registered ceiling of 10%. The gate was registered before measurement and has
  not been revised. On this evidence the reason codes are not fit to serve as adverse-action
  notices.'
- The registered perturbation scale turned out not to discriminate between model classes,
  since no model passes at it. That is a fault in the registration, reported rather than corrected
  after the fact.
- The cost ratio is published (UCI German Credit, 5:1); the loss given default, margin rate
  and AED exposure are assumed. No dirham figure is a measurement.
- A single cost matrix treats every applicant as carrying the same loss and margin. Exposures
  on this book span a factor of 70; the exposure-weighted sensitivity is reported in reports/decision_table.md.
- Reject inference did not work. Parcelling recovered none of the selection gap at any tested
  k, degrading PR-AUC by up to 0.0126 and calibration further. Nothing else in this project
  depends on it.
- Hyperparameters are fixed across rungs and untuned. The ladder measures what constraints
  cost, not how high the AUC can be pushed.
- Intervals cover measurement on one test split. They do not cover how much a metric would
  move on different training data, which is larger.
- This card is an academic artifact. It is the author's reading of published guidance, not
  legal advice, and it has not been reviewed by a lawyer or a compliance function.
