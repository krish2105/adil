model:
  name: ADIL — explainable credit decisioning
  version: 0.1.0 (rung R6, seed 20260827)
  owner: Krishna Mathur, MAIB AI 217, SP Jain School of Global Management, Dubai
  model_class: LightGBM, monotone-constrained on 5 of 20 features, capped at 20 features,
    isotonic-calibrated, single approval cutoff
  baseline: Weight-of-evidence scorecard, 20 characteristics, PDO 20 / 50:1 / 600
  status: Academic coursework. Not deployed and not deployable.
intended_use: Demonstrating that explanation, fairness evidence and threshold justification
  can be first-class deliverables in a consumer credit model rather than appendices to one.
  It answers a research question — whether the accuracy gained by moving from a weight-of-evidence
  scorecard to gradient boosting survives explainability and fairness constraints, and what
  it costs per approved application. It is not a lending model. It is fitted on public competition
  data from another market, has no monitoring, no out-of-time validation and no human review
  process, and must not be used to decide anything about a real applicant.
data:
  source: Home Credit Default Risk (Kaggle), all seven tables, 307,511 applications and 574
    columns
  provenance: real
  not_uae_data: Public competition data from another market. The distribution differs materially
    from any Emirati lending book and no figure here transfers to one without re-estimation.
  split: Stratified 60/20/20 train/calibration/test, seed 20260827, target-rate spread 1.31e-06
  no_temporal_split: application_train carries no application date; every DAYS_* column is
    relative to the application. No time axis exists, so no temporal split is possible and
    spine.splitting is deliberately unused. Leakage is controlled instead by as-of-application
    feature construction, tested in tests/test_features.py.
  leakage_control: Every satellite aggregate is filtered to records knowable at application
    time. Removal counts are recorded for all six tables, including the three where the filter
    removes nothing.
  currency: Anonymised and unscaled. All costs are reported in dataset currency units. Any
    dirham figure in this project is a labelled scenario, not a finding.
